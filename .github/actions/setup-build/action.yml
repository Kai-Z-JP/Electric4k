name: Set up Kotlin build
description: Configure JDK, Android SDK and Gradle for the shared Multiplatform project
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    # The shared Gradle project applies the Android plugin on every host.
    - uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
    - uses: gradle/actions/setup-gradle@v4
